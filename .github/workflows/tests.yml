name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  local:
    name: Lint, API and web tests (local Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: |
          uv sync
          uv run playwright install --with-deps chromium
      - name: Lint
        run: uv run ruff check .
      - name: Check every suite collects
        run: uv run pytest --collect-only -q
      - name: Run API and web tests
        run: uv run pytest tests/api tests/web

  browserstack:
    name: ${{ matrix.suite }} tests on BrowserStack
    needs: local
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [web, mobile]
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      JIRA_URL: ${{ secrets.JIRA_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY || 'SCRUM' }}
      JIRA_BOARD_ID: ${{ vars.JIRA_BOARD_ID || '1' }}
    steps:
      - name: Check BrowserStack credentials
        id: creds
        run: |
          if [ -n "$BROWSERSTACK_USERNAME" ] && [ -n "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::BrowserStack secrets are not set, skipping the ${{ matrix.suite }} cloud run."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.enabled == 'true'
      - uses: astral-sh/setup-uv@v5
        if: steps.creds.outputs.enabled == 'true'
      # Install only this suite's framework: the SDK skips Appium when Playwright is installed.
      - name: Install dependencies
        if: steps.creds.outputs.enabled == 'true'
        run: |
          if [ "${{ matrix.suite }}" = "mobile" ]; then uv sync --no-group web; else uv sync --no-group mobile; fi

      - name: Download the demo app
        if: steps.creds.outputs.enabled == 'true' && matrix.suite == 'mobile'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v2.0.0 -R webdriverio/native-demo-app -p 'android.wdio.native.app.v2.0.0.apk' -D apps/android

      - name: Write TestRail config
        if: steps.creds.outputs.enabled == 'true' && vars.ENABLE_TESTRAIL == 'true'
        run: |
          cat <<CFG > testrail.cfg
          [API]
          url = ${{ secrets.TESTRAIL_URL }}
          email = ${{ secrets.TESTRAIL_EMAIL }}
          password = ${{ secrets.TESTRAIL_API_KEY }}

          [TESTRUN]
          project_id = 2
          CFG

      - name: Run ${{ matrix.suite }} tests on BrowserStack
        if: steps.creds.outputs.enabled == 'true'
        env:
          SUITE: ${{ matrix.suite }}
          ENABLE_TESTRAIL: ${{ vars.ENABLE_TESTRAIL }}
          ENABLE_JIRA: ${{ vars.ENABLE_JIRA }}
        run: |
          cp "browserstack/$SUITE.yml" browserstack.yml
          flags=()
          if [ "$ENABLE_TESTRAIL" = "true" ]; then flags+=(--testrail); fi
          if [ "$ENABLE_JIRA" = "true" ]; then flags+=(--jira); fi
          if [ "$SUITE" = "mobile" ]; then flags+=(--platform android); fi
          uv run --no-sync browserstack-sdk pytest "tests/$SUITE/" "${flags[@]}"
