userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}
# The SDK uploads this file before the run. Download it from the WebdriverIO native demo app
# release v2.0.0 (see README). Uploaded apps expire on BrowserStack after 30 days, so the
# app is uploaded on every run instead of pinning a bs:// ID.
app: ./apps/android/android.wdio.native.app.v2.0.0.apk
platforms:
  - platformName: android
    osVersion: 12.0
    deviceName: Samsung Galaxy S22 Ultra
browserstackLocal: false
buildName: pytest-appium-build
projectName: qa-py-browserstack
debug: true
networkLogs: true
consoleLogs: errors
